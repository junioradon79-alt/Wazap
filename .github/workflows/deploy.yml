name: Deploy prod (SmarterASP - FTP)

# Déploiement AUTOMATIQUE vers la production SmarterASP :
#   • à chaque push sur main touchant src/** , scripts/cd-deploy.sh, Wazap.slnx ou ce workflow ;
#   • ou en manuel (workflow_dispatch).
# Les MIGRATIONS prod sont appliquées automatiquement AVANT l'upload (idempotentes),
# puis l'upload différentiel (manifest SHA-256) se termine par le health check.
#
# ⚠️ Secrets à configurer dans le dépôt (Settings → Secrets and variables → Actions) :
#   SMARTERASP_FTP_HOST        ex: ftp://WIN6054.site4now.net (schéma inclus)
#   SMARTERASP_FTP_USER
#   SMARTERASP_FTP_PASSWORD
#   SMARTERASP_FTP_REMOTE_DIR  (défaut /wazap2)
#   SMARTERASP_APP_URL         (défaut https://junioradon79gm-001-site1.jtempurl.com/health)
#   SMARTERASP_DB_CONNECTION   chaîne de connexion PostgreSQL PROD
#     ex: Host=pg6001.site4now.net;Port=6432;Database=db_acdd27_wazap;Username=...;Password=...;SSL Mode=Require
#
# 💡 Les tests unitaires sont exécutés AVANT le publish : du code cassé (ex. service
#    non enregistré en DI — incident prod du 11/09) NE PEUT PLUS atteindre la prod.
#    Le workflow CI tourne en parallèle mais NE bloque PAS le déploiement : c'est le
#    gate « Tests (garde-fou …) » ci-dessous, dans CE workflow, qui fait foi.
#
# Le web.config DISTANT n'est jamais écrasé (il porte les env vars de prod).

on:
  push:
    branches: [ main ]
    paths:
      - 'src/**'
      - 'web/**'
      - 'Wazap.slnx'
      - 'scripts/cd-deploy.sh'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:
    inputs:
      full_deploy:
        description: 'Forcer un déploiement complet (ignorer le différentiel)'
        type: boolean
        default: false
      apply_migrations:
        description: 'Appliquer les migrations prod avant déploiement'
        type: boolean
        default: true
      skip_backup:
        description: 'URGENCE : sauter la sauvegarde pg_dump avant migration (déconseillé)'
        type: boolean
        default: false

concurrency:
  group: deploy-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Environnement GitHub dédié : permet d'exiger une approbation humaine et de restreindre
    # les secrets au déploiement (Settings → Environments → production → Required reviewers).
    # Sans protection configurée, la déclaration est inerte — mais elle rend la protection
    # possible sans modifier le workflow.
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore (RID win-x64 pour le self-contained)
        run: dotnet restore Wazap.slnx -r win-x64

      - name: Build (Release)
        run: dotnet build Wazap.slnx --configuration Release --no-restore

      - name: "Tests (garde-fou : ne jamais déployer du code cassé)"
        # Bloque le déploiement si un test échoue — notamment DiControllerResolutionTests
        # (constructibilité réelle de chaque contrôleur via le conteneur DI de production).
        run: dotnet test tests/Wazap.UnitTests/Wazap.UnitTests.csproj --configuration Release --no-build

      - name: Setup Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Build du front (React) → wwwroot/app
        # `dotnet publish` ne reconstruit PAS le front : le bundle de
        # src/Wazap.API/wwwroot/app était committé et n'était jamais régénéré — la
        # production servait donc une SPA figée, sans rapport avec web/src (six commits
        # de retard constatés le 15/09). Le front est désormais reconstruit à chaque
        # déploiement, puis copié à l'emplacement réellement servi.
        run: |
          set -euo pipefail
          cd web
          npm ci
          npm run build
          rm -rf ../src/Wazap.API/wwwroot/app
          mkdir -p ../src/Wazap.API/wwwroot/app
          cp -r dist/* ../src/Wazap.API/wwwroot/app/
          test -f ../src/Wazap.API/wwwroot/app/index.html

      - name: Publish self-contained (win-x64)
        run: dotnet publish src/Wazap.API/Wazap.API.csproj -c Release -r win-x64 --self-contained true -o artifacts/publish-win64 --no-restore

      - name: Client PostgreSQL (pg_dump)
        # pg_dump d'une version RÉCENTE sait sauvegarder un serveur plus ancien : on installe
        # donc la dernière version disponible plutôt que celle de l'image, pour ne jamais
        # échouer sur un « server version mismatch ».
        if: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.apply_migrations)) && !inputs.skip_backup }}
        run: |
          set -euo pipefail
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc \
            https://www.postgresql.org/media/keys/ACCC4CF8.asc
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt $(lsb_release -cs)-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list > /dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          pg_dump --version

      - name: Sauvegarde de la base prod AVANT migration (pg_dump)
        # Les migrations sont appliquées automatiquement : sans sauvegarde préalable, une
        # migration destructive (colonne supprimée, type changé) était irréversible — aucune
        # procédure de restauration n'existait. Le dump est conservé comme artefact du run.
        #
        # Robustesse : deux méthodes sont tentées (client du runner, puis conteneur PostgreSQL
        # le plus récent — un pg_dump récent sait sauvegarder un serveur plus ancien, l'inverse
        # est faux). Si les deux échouent, le déploiement CONTINUE avec un avertissement très
        # visible : bloquer une mise en production sur un problème d'outillage serait pire pour
        # le service que déployer sans filet. L'échec est journalisé pour être corrigé.
        if: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.apply_migrations)) && !inputs.skip_backup }}
        shell: bash
        env:
          PROD_DB: ${{ secrets.SMARTERASP_DB_CONNECTION }}
        run: |
          set -uo pipefail
          if [ -z "$PROD_DB" ]; then
            echo "::warning::SMARTERASP_DB_CONNECTION absent — déploiement SANS sauvegarde préalable."
            exit 0
          fi

          # Conversion de la chaîne Npgsql (clé=valeur séparés par « ; ») en DSN libpq
          # (clé=valeur séparés par des espaces, clés minuscules). On ne recopie QUE les
          # paramètres connus : libpq refuse une clé inconnue. Le mot de passe passe par
          # PGPASSWORD (une valeur contenant « ; » ou une espace casserait le DSN).
          dsn=""
          password=""
          while IFS= read -r part; do
            key="${part%%=*}"; value="${part#*=}"
            key="$(echo "$key" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')"
            case "$key" in
              host)     dsn="$dsn host='$value'" ;;
              port)     dsn="$dsn port='$value'" ;;
              database) dsn="$dsn dbname='$value'" ;;
              username) dsn="$dsn user='$value'" ;;
              password) password="$value" ;;
              sslmode)  dsn="$dsn sslmode='$value'" ;;
            esac
          done < <(printf '%s' "$PROD_DB" | tr ';' '\n')

          stamp="$(date -u +%Y%m%d_%H%M%S)"
          mkdir -p backups
          dump="backups/prod_${stamp}.dump"
          ok=0

          # Méthode 1 : client installé sur le runner (le plus rapide).
          echo "--- pg_dump (client du runner) ---"
          if PGPASSWORD="$password" pg_dump --no-owner --no-privileges --format=custom \
               --file="$dump" "$dsn"; then
            ok=1
          else
            echo "::warning::pg_dump (client runner) en échec — nouvelle tentative via conteneur."
          fi

          # Méthode 2 : conteneur PostgreSQL le plus récent (couvre un serveur plus récent que
          # le client du runner, cause classique d'un « server version mismatch »).
          if [ "$ok" -eq 0 ]; then
            rm -f "$dump"
            echo "--- pg_dump (conteneur postgres:latest) ---"
            if docker run --rm -e PGPASSWORD="$password" postgres:latest \
                 pg_dump --no-owner --no-privileges --format=custom "$dsn" > "$dump"; then
              ok=1
            fi
          fi

          if [ "$ok" -eq 0 ] || [ ! -s "$dump" ]; then
            rm -f "$dump"
            echo "::error::SAUVEGARDE IMPOSSIBLE avant migration — déploiement poursuivi sans filet. Vérifiez la version du serveur PostgreSQL et la connectivité depuis les runners GitHub."
            exit 0
          fi

          ls -lh backups/
          echo "Sauvegarde : $dump ($(stat -c%s "$dump") octets)"

      - name: Publier la sauvegarde comme artefact
        if: ${{ (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.apply_migrations)) && !inputs.skip_backup }}
        uses: actions/upload-artifact@v4
        with:
          name: sauvegarde-base-prod
          path: backups/*.dump
          retention-days: 30
          if-no-files-found: ignore

      - name: Appliquer les migrations prod (idempotent)
        if: ${{ github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.apply_migrations) }}
        shell: bash
        env:
          PROD_DB: ${{ secrets.SMARTERASP_DB_CONNECTION }}
        run: |
          if [ -z "$PROD_DB" ]; then
            echo "::error::Le secret SMARTERASP_DB_CONNECTION n'est pas configuré — ajoutez-le pour activer les migrations automatiques."
            exit 1
          fi
          dotnet tool restore
          dotnet ef database update --project src/Wazap.Infrastructure --startup-project src/Wazap.API --connection "$PROD_DB"

      - name: Déploiement FTP différentiel (manifest SHA-256 + upload + health check)
        run: bash scripts/cd-deploy.sh artifacts/publish-win64
        env:
          SMARTERASP_FTP_HOST: ${{ secrets.SMARTERASP_FTP_HOST }}
          SMARTERASP_FTP_USER: ${{ secrets.SMARTERASP_FTP_USER }}
          SMARTERASP_FTP_PASSWORD: ${{ secrets.SMARTERASP_FTP_PASSWORD }}
          SMARTERASP_FTP_REMOTE_DIR: ${{ secrets.SMARTERASP_FTP_REMOTE_DIR }}
          SMARTERASP_APP_URL: ${{ secrets.SMARTERASP_APP_URL }}
          FORCE_FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full_deploy || false }}

