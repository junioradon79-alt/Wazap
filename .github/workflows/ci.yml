name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend:
    name: Backend (.NET)
    runs-on: ubuntu-latest

    # B-19 — PostgreSQL RÉEL pour les tests de chemins relationnels.
    #
    # Pourquoi un service container plutôt que Testcontainers : la bibliothèque tire SSH.NET
    # 2024.1.0, qui porte une vulnérabilité élevée (GHSA-q939-rpr3-3284) que l'étape « Audit des
    # dépendances vulnérables » ci-dessous refuse — à raison. Le service fourni par le runner
    # donne le même moteur, sans ajouter UNE SEULE dépendance NuGet au projet de tests.
    #
    # Sans ce service, ces tests s'annoncent « ignorés » (avec la raison) au lieu d'échouer : la
    # couverture PostgreSQL n'est donc jamais simulée.
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      WAZAP_TEST_POSTGRES: "Host=localhost;Port=5432;Database=postgres;Username=postgres;Password=postgres"

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4
        with:
          dotnet-version: '10.0.x'

      # Sans cache, chaque exécution retéléchargeait l'intégralité des paquets NuGet.
      - name: Cache NuGet
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', '**/Directory.Build.props') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Wazap.slnx

      - name: Build (avertissements traités comme des erreurs)
        # Le projet compile aujourd'hui à 0 avertissement : cette barre empêche la
        # réintroduction silencieuse de code douteux (nullabilité, API obsolète, etc.).
        run: dotnet build Wazap.slnx --configuration Release --no-restore -warnaserror

      - name: Audit des dépendances vulnérables
        run: dotnet list Wazap.slnx package --vulnerable --include-transitive

      - name: "Tests (garde-fou bloquant)"
        run: dotnet test tests/Wazap.UnitTests/Wazap.UnitTests.csproj --configuration Release --no-build

      # B-19 — PREUVE que la couverture PostgreSQL a réellement tourné.
      # Sans ce contrôle, un service injoignable ferait « ignorer » les tests PostgreSQL et la CI
      # resterait verte : la couverture serait alors simulée, ce qui est pire que son absence.
      # Ici, un test non exécuté fait échouer la CI avec un message explicite.
      - name: "PostgreSQL réel (B-19) — preuve d'exécution"
        run: |
          set -uo pipefail

          rm -rf ./TestResults/postgres
          dotnet test tests/Wazap.UnitTests/Wazap.UnitTests.csproj \
            --configuration Release --no-build \
            --filter "FullyQualifiedName~PostgresMoneyPathsTests" \
            --logger "trx;LogFileName=postgres.trx" \
            --results-directory ./TestResults/postgres

          report=./TestResults/postgres/postgres.trx
          passed=$(grep -c 'outcome="Passed"' "$report" || true)
          skipped=$(grep -c 'outcome="NotExecuted"' "$report" || true)
          echo "Tests PostgreSQL : $passed réussi(s), $skipped ignoré(s)."

          if [ "$skipped" != "0" ]; then
            echo "::error::Des tests PostgreSQL ont été IGNORÉS — le service n'était pas joignable. Vérifiez WAZAP_TEST_POSTGRES et le service 'postgres' du job."
            exit 1
          fi
          if [ "$passed" -lt 6 ]; then
            echo "::error::Moins de 6 tests PostgreSQL ont été exécutés ($passed) : la couverture du moteur de production n'est plus assurée."
            exit 1
          fi

      - name: Couverture (mesure et seuil indicatif)
        # Étape SÉPARÉE et non bloquante : le garde-fou de la CI reste le résultat des tests
        # ci-dessus. Un aléa de l'outillage de couverture (collecteur, format de rapport) ne doit
        # pas rougir la CI ni bloquer un déploiement — mais un décrochage de couverture doit être
        # VISIBLE, d'où l'annotation d'erreur et le rapport publié en artefact.
        continue-on-error: true
        run: |
          set -uo pipefail

          dotnet test tests/Wazap.UnitTests/Wazap.UnitTests.csproj \
            --configuration Release --no-build \
            --collect:"XPlat Code Coverage" \
            --settings tests/Wazap.UnitTests/coverlet.runsettings \
            --results-directory artifacts/coverage || echo "::warning::Collecte de couverture en échec."

          file=$(find artifacts/coverage -name coverage.cobertura.xml 2>/dev/null | head -1)
          if [ -z "$file" ]; then
            echo "::warning::Aucun rapport de couverture produit — seuil non appliqué."
            exit 0
          fi
          echo "Rapport : $file"

          # Le taux global est porté par l'élément racine <coverage line-rate="…">.
          rate=$(grep -o 'line-rate="[0-9.]*"' "$file" | head -1 | sed 's/[^0-9.]//g')
          if ! printf '%s' "$rate" | grep -Eq '^[0-9]+(\.[0-9]+)?$'; then
            echo "::warning::Taux de couverture illisible ('$rate') — seuil non appliqué."
            exit 0
          fi

          pct=$(awk -v r="$rate" 'BEGIN { printf "%.1f", r * 100 }')
          echo "### Couverture (hors migrations générées) : ${pct} %" >> "$GITHUB_STEP_SUMMARY"
          echo "Couverture (hors migrations générées) : ${pct} %"

          if awk -v r="$rate" 'BEGIN { exit !(r < 0.75) }'; then
            echo "::error::Couverture ${pct} % sous le seuil de 75 % — ajoutez des tests."
          fi

      - name: Publier la couverture
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: couverture-tests
          path: artifacts/coverage/**/coverage.cobertura.xml
          retention-days: 30
          if-no-files-found: warn

      - name: Compiler les outils d'exploitation
        # Les 9 projets de tools/ ne font pas partie de la solution (conflit de version
        # EF Core Relational) : ils n'étaient donc JAMAIS compilés par la CI. Or l'un d'eux,
        # PurgeTestData, exécute des DELETE sans clause WHERE — un outil destructif qui ne
        # compile plus doit être vu au commit, pas au moment de l'exécuter en production.
        run: |
          set -euo pipefail
          for project in tools/*/*.csproj; do
            echo "::group::$project"
            dotnet build "$project" --configuration Release --nologo
            echo "::endgroup::"
          done

      - name: Publish
        run: dotnet publish src/Wazap.API/Wazap.API.csproj --configuration Release --no-restore --output artifacts/publish

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: wazap-api
          path: artifacts/publish
          if-no-files-found: error

  frontend:
    name: Frontend (React + TypeScript)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node 24
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Aucun garde-fou n'existait sur le front : le bundle servi en production
      # (src/Wazap.API/wwwroot/app) avait six commits de retard sur web/src.
      - name: Install
        run: npm ci
        working-directory: web

      - name: Lint
        # Le front n'avait AUCUN lint : ni règles de hooks React (dépendances de useEffect,
        # usage conditionnel), ni détection de code mort.
        run: npm run lint
        working-directory: web

      - name: Tests unitaires
        # Aucun test front n'existait alors que le client HTTP porte l'authentification
        # (jeton, renouvellement, purge de session) et que les pages manipulent de l'argent.
        run: npm run test
        working-directory: web

      - name: Typecheck + build
        run: npm run build
        working-directory: web

      # Vérifie que le bundle produit est bien celui attendu par la page servie :
      # une page HTML pointant vers un fichier absent donnait une application blanche.
      - name: Vérifier les références du bundle
        run: |
          set -euo pipefail
          missing=0
          for asset in $(grep -oE '/app/assets/[A-Za-z0-9._-]+' web/dist/index.html | sort -u); do
            file="web/dist/${asset#/app/}"
            if [ ! -f "$file" ]; then
              echo "::error::index.html référence $asset, absent de web/dist"
              missing=1
            fi
          done
          exit $missing
