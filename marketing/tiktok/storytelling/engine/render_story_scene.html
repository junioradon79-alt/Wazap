<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <title>WAZAP TikTok Storytelling Scene Renderer</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;700;800;900&display=swap');

    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #070c09;
      color: #ffffff;
      -webkit-font-smoothing: antialiased;
    }

    .scene-container {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 90px 70px 110px 70px;
    }

    /* Background Character Photo */
    .bg-character {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
      object-fit: cover;
      object-position: center;
      z-index: 1;
      filter: brightness(0.88) contrast(1.06);
    }

    /* Cinematic Overlays to guarantee readability */
    .overlay-top {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 480px;
      background: linear-gradient(180deg, rgba(7, 12, 9, 0.94) 0%, rgba(7, 12, 9, 0.75) 55%, transparent 100%);
      z-index: 2;
    }

    .overlay-bottom {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      height: 620px;
      background: linear-gradient(0deg, rgba(7, 12, 9, 0.98) 0%, rgba(7, 12, 9, 0.88) 55%, transparent 100%);
      z-index: 2;
    }

    /* Ambient glow */
    .ambient-glow {
      position: absolute;
      top: 250px;
      left: 50%;
      transform: translateX(-50%);
      width: 700px;
      height: 400px;
      background: radial-gradient(ellipse, rgba(0, 214, 108, 0.18) 0%, transparent 70%);
      z-index: 2;
      pointer-events: none;
    }

    /* Content layers */
    .top-section {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .header-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .series-pill {
      display: inline-flex;
      align-items: center;
      gap: 12px;
      background: rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(16px);
      border: 1.5px solid rgba(255, 255, 255, 0.22);
      border-radius: 999px;
      padding: 12px 26px;
      font-size: 22px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: #ffffff;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
    }

    .series-pill .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #ff3b30;
      box-shadow: 0 0 12px #ff3b30;
    }

    .series-pill.green .dot {
      background: #00d66c;
      box-shadow: 0 0 12px #00d66c;
    }

    .brand-tag {
      display: flex;
      align-items: center;
      gap: 10px;
      background: rgba(0, 214, 108, 0.18);
      border: 1.5px solid rgba(0, 214, 108, 0.4);
      padding: 10px 22px;
      border-radius: 999px;
      font-weight: 800;
      font-size: 20px;
      color: #00d66c;
    }

    /* Scene Hook Sticker */
    .scene-hook {
      background: rgba(15, 23, 18, 0.92);
      backdrop-filter: blur(20px);
      border: 2px solid rgba(255, 255, 255, 0.18);
      border-radius: 24px;
      padding: 24px 30px;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5);
    }

    .scene-hook.danger {
      border-color: rgba(255, 69, 58, 0.5);
      background: linear-gradient(135deg, rgba(40, 10, 12, 0.94) 0%, rgba(18, 12, 14, 0.94) 100%);
    }

    .scene-hook.success {
      border-color: rgba(0, 214, 108, 0.5);
      background: linear-gradient(135deg, rgba(8, 32, 18, 0.94) 0%, rgba(10, 20, 15, 0.94) 100%);
    }

    .hook-badge {
      display: inline-block;
      font-size: 20px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      padding: 6px 16px;
      border-radius: 8px;
      margin-bottom: 12px;
    }

    .hook-badge.red {
      background: #ff3b30;
      color: #ffffff;
    }

    .hook-badge.orange {
      background: #ff9500;
      color: #000000;
    }

    .hook-badge.green {
      background: #00d66c;
      color: #000000;
    }

    .hook-badge.gold {
      background: #f7c948;
      color: #000000;
    }

    .hook-text {
      font-size: 38px;
      font-weight: 900;
      line-height: 1.25;
      color: #ffffff;
      letter-spacing: -0.01em;
    }

    .hook-text highlight {
      color: #00d66c;
    }
    .hook-text highlight.yellow {
      color: #f7c948;
    }
    .hook-text highlight.red {
      color: #ff5252;
    }

    /* Middle Floating Element: WhatsApp / Notification Bubble */
    .middle-section {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 20px;
      margin-top: -80px;
    }

    .whatsapp-bubble {
      max-width: 820px;
      background: rgba(18, 30, 23, 0.95);
      backdrop-filter: blur(25px);
      border: 1.5px solid rgba(0, 214, 108, 0.35);
      border-radius: 28px;
      padding: 24px 30px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6);
      align-self: flex-start;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .whatsapp-bubble.incoming {
      align-self: flex-start;
      background: rgba(22, 27, 34, 0.95);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .whatsapp-bubble.outgoing {
      align-self: flex-end;
      background: rgba(5, 52, 30, 0.95);
      border-color: rgba(0, 214, 108, 0.45);
    }

    .bubble-author {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      font-size: 22px;
      font-weight: 700;
      color: #8be4b5;
    }

    .bubble-author .time {
      font-size: 18px;
      font-weight: 500;
      color: rgba(255, 255, 255, 0.5);
    }

    .bubble-message {
      font-size: 32px;
      font-weight: 700;
      line-height: 1.35;
      color: #ffffff;
    }

    .bubble-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      font-size: 18px;
      color: rgba(255, 255, 255, 0.6);
    }

    .checks {
      color: #34b7f1;
      font-weight: 900;
      letter-spacing: -2px;
    }

    /* Value Proposition Grid / Cards in scenes 3 & 4 */
    .benefit-cards {
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .benefit-card {
      display: flex;
      align-items: center;
      gap: 20px;
      background: rgba(10, 22, 15, 0.92);
      backdrop-filter: blur(18px);
      border: 1.5px solid rgba(0, 214, 108, 0.3);
      border-radius: 20px;
      padding: 18px 24px;
      font-size: 26px;
      font-weight: 800;
      color: #ffffff;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
    }

    .benefit-card .icon {
      font-size: 36px;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 58px;
      height: 58px;
      background: rgba(0, 214, 108, 0.15);
      border-radius: 14px;
      flex-shrink: 0;
    }

    /* Bottom Subtitle / Captions area */
    .bottom-section {
      position: relative;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .caption-box {
      background: rgba(7, 12, 9, 0.9);
      backdrop-filter: blur(20px);
      border: 1.5px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 26px 32px;
      text-align: center;
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
    }

    .caption-box .sub-label {
      font-size: 19px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.12em;
      color: rgba(255, 255, 255, 0.55);
      margin-bottom: 8px;
    }

    .caption-box .subtitle-text {
      font-size: 36px;
      font-weight: 900;
      line-height: 1.35;
      color: #ffffff;
    }

    .caption-box .subtitle-text .kw {
      color: #f7c948;
      background: rgba(247, 201, 72, 0.15);
      padding: 2px 10px;
      border-radius: 8px;
    }

    .caption-box .subtitle-text .kw-green {
      color: #00d66c;
      background: rgba(0, 214, 108, 0.15);
      padding: 2px 10px;
      border-radius: 8px;
    }

    .cta-banner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: linear-gradient(135deg, #00d66c 0%, #00a854 100%);
      color: #05140b;
      padding: 22px 36px;
      border-radius: 22px;
      font-size: 28px;
      font-weight: 900;
      box-shadow: 0 12px 35px rgba(0, 214, 108, 0.4);
    }

    .cta-banner .cta-sub {
      font-size: 20px;
      font-weight: 700;
      opacity: 0.85;
    }
  </style>
</head>
<body>
  <div class="scene-container">
    <!-- Character Background Image -->
    <img id="bgImg" class="bg-character" src="" alt="Scene Character">

    <!-- Cinematic Gradients -->
    <div class="overlay-top"></div>
    <div class="overlay-bottom"></div>
    <div class="ambient-glow"></div>

    <!-- Top Section -->
    <div class="top-section">
      <div class="header-bar">
        <div id="seriesPill" class="series-pill">
          <span class="dot"></span>
          <span id="seriesTitle">SÉRIE : LES GALÈRES D'ABIDJAN</span>
        </div>
        <div class="brand-tag">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#00d66c" stroke-width="2.5">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
          </svg>
          <span>WAZAP.CI</span>
        </div>
      </div>

      <div id="sceneHookCard" class="scene-hook">
        <span id="hookBadge" class="hook-badge">ALERTE</span>
        <div id="hookText" class="hook-text">Titre de la scène</div>
      </div>
    </div>

    <!-- Middle Floating WhatsApp Bubble or Benefits -->
    <div class="middle-section">
      <div id="whatsappBubble" class="whatsapp-bubble" style="display: none;">
        <div class="bubble-author">
          <span id="bubbleSender">Expéditeur</span>
          <span id="bubbleTime" class="time">11:42</span>
        </div>
        <div id="bubbleMessage" class="bubble-message">
          Message WhatsApp
        </div>
        <div class="bubble-footer">
          <span class="checks">✓✓</span>
        </div>
      </div>

      <div id="benefitCards" class="benefit-cards" style="display: none;">
        <!-- Injected dynamically -->
      </div>
    </div>

    <!-- Bottom Section: Subtitles & CTA -->
    <div class="bottom-section">
      <div class="caption-box">
        <div id="captionLabel" class="sub-label">VOIX OFF</div>
        <div id="captionText" class="subtitle-text">Texte du sous-titre</div>
      </div>

      <div id="ctaBanner" class="cta-banner" style="display: none;">
        <div>
          <div>TESTE WAZAP GRATUITEMENT</div>
          <div class="cta-sub">Lien officiel dans la bio TikTok</div>
        </div>
        <svg width="34" height="34" viewBox="0 0 24 24" fill="none" stroke="#05140b" stroke-width="3">
          <path d="M5 12h14M12 5l7 7-7 7"/>
        </svg>
      </div>
    </div>
  </div>

  <script>
    window.renderStoryScene = function(data) {
      if (!data) return;

      // Background image
      if (data.bgImage) {
        document.getElementById('bgImg').src = data.bgImage;
      }

      // Series pill
      if (data.seriesTitle) {
        document.getElementById('seriesTitle').innerText = data.seriesTitle;
      }
      if (data.isSuccess) {
        document.getElementById('seriesPill').classList.add('green');
      }

      // Hook Card
      const hookCard = document.getElementById('sceneHookCard');
      const badge = document.getElementById('hookBadge');
      const hookText = document.getElementById('hookText');

      if (data.hookBadge) {
        badge.innerText = data.hookBadge;
        badge.className = 'hook-badge ' + (data.hookBadgeColor || 'red');
      }
      if (data.hookText) {
        hookText.innerHTML = data.hookText;
      }
      if (data.hookType === 'danger') {
        hookCard.className = 'scene-hook danger';
      } else if (data.hookType === 'success') {
        hookCard.className = 'scene-hook success';
      } else {
        hookCard.className = 'scene-hook';
      }

      // WhatsApp Bubble
      const bubble = document.getElementById('whatsappBubble');
      if (data.bubble) {
        bubble.style.display = 'flex';
        bubble.className = 'whatsapp-bubble ' + (data.bubble.direction || 'incoming');
        document.getElementById('bubbleSender').innerText = data.bubble.sender || 'WhatsApp';
        document.getElementById('bubbleTime').innerText = data.bubble.time || '11:45';
        document.getElementById('bubbleMessage').innerHTML = data.bubble.message || '';
      } else {
        bubble.style.display = 'none';
      }

      // Benefit Cards
      const benefitCards = document.getElementById('benefitCards');
      if (data.benefits && data.benefits.length > 0) {
        benefitCards.style.display = 'flex';
        benefitCards.innerHTML = data.benefits.map(b => `
          <div class="benefit-card">
            <div class="icon">${b.icon || '✅'}</div>
            <div>${b.text}</div>
          </div>
        `).join('');
      } else {
        benefitCards.style.display = 'none';
      }

      // Caption
      if (data.captionLabel) {
        document.getElementById('captionLabel').innerText = data.captionLabel;
      }
      if (data.captionText) {
        document.getElementById('captionText').innerHTML = data.captionText;
      }

      // CTA Banner
      const cta = document.getElementById('ctaBanner');
      if (data.showCta) {
        cta.style.display = 'flex';
      } else {
        cta.style.display = 'none';
      }
    };

    // Auto-initialize from query parameters
    window.addEventListener('DOMContentLoaded', () => {
      const params = new URLSearchParams(window.location.search);
      if (!params.toString()) return;

      const data = {
        bgImage: params.get('bgImage'),
        seriesTitle: params.get('seriesTitle'),
        isSuccess: params.get('isSuccess') === 'true',
        hookBadge: params.get('hookBadge'),
        hookBadgeColor: params.get('hookBadgeColor'),
        hookType: params.get('hookType'),
        hookText: params.get('hookText'),
        captionLabel: params.get('captionLabel'),
        captionText: params.get('captionText'),
        showCta: params.get('showCta') === 'true'
      };

      if (params.get('bubbleMessage')) {
        data.bubble = {
          direction: params.get('bubbleDir') || 'incoming',
          sender: params.get('bubbleSender') || 'WhatsApp',
          time: params.get('bubbleTime') || '11:42',
          message: params.get('bubbleMessage')
        };
      }

      if (params.get('benefits')) {
        try {
          data.benefits = JSON.parse(params.get('benefits'));
        } catch (e) {
          data.benefits = [];
        }
      }

      window.renderStoryScene(data);
    });
  </script>
</body>
</html>
