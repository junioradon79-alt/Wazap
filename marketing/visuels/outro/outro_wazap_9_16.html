<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WAZAP — Outro Officielle 9:16 (Animation)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      overflow: hidden;
    }

    /* Cadre 9:16 exact (1080 x 1920 simulé responsive) */
    .viewport {
      position: relative;
      width: 100vw;
      max-width: 540px;
      height: 100vh;
      max-height: 960px;
      background: radial-gradient(circle at 50% 42%, #042417 0%, #081119 55%, #03070b 100%);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 60px 30px;
      box-shadow: 0 0 50px rgba(0, 168, 107, 0.25);
    }

    /* Grille lumineuse tech en arrière-plan */
    .tech-grid {
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(0, 168, 107, 0.05) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0, 168, 107, 0.05) 1px, transparent 1px);
      background-size: 40px 40px;
      pointer-events: none;
      opacity: 0.6;
    }

    /* Halo lumineux vert d'ambiance */
    .glow-aura {
      position: absolute;
      top: 38%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 420px;
      height: 420px;
      background: radial-gradient(circle, rgba(0, 209, 134, 0.35) 0%, rgba(0, 168, 107, 0.1) 45%, transparent 70%);
      border-radius: 50%;
      filter: blur(40px);
      animation: pulseAura 3s ease-in-out infinite alternate;
      pointer-events: none;
    }

    @keyframes pulseAura {
      0% { transform: translate(-50%, -50%) scale(0.9); opacity: 0.7; }
      100% { transform: translate(-50%, -50%) scale(1.15); opacity: 1; }
    }

    /* Onde de choc d'éclair initial */
    .shockwave {
      position: absolute;
      top: 40%;
      left: 50%;
      transform: translate(-50%, -50%) scale(0);
      width: 200px;
      height: 200px;
      border: 3px solid rgba(255, 255, 255, 0.9);
      border-radius: 50%;
      box-shadow: 0 0 30px #00FF9D;
      opacity: 0;
      animation: fireShockwave 1.2s cubic-bezier(0.1, 0.8, 0.2, 1) forwards;
      pointer-events: none;
    }

    @keyframes fireShockwave {
      0% { transform: translate(-50%, -50%) scale(0); opacity: 1; border-width: 8px; }
      50% { opacity: 0.8; }
      100% { transform: translate(-50%, -50%) scale(4); opacity: 0; border-width: 1px; }
    }

    /* Éclair de vitesse initial */
    .lightning-streak {
      position: absolute;
      top: -100px;
      left: -100px;
      width: 4px;
      height: 350px;
      background: linear-gradient(180deg, transparent, #FFFFFF, #00FF9D, transparent);
      transform: rotate(45deg);
      filter: drop-shadow(0 0 15px #00FF9D);
      opacity: 0;
      animation: streakAcross 0.6s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
    }

    @keyframes streakAcross {
      0% { top: -200px; left: -200px; opacity: 1; }
      70% { opacity: 1; }
      100% { top: 700px; left: 700px; opacity: 0; }
    }

    /* Zone centrale du logo */
    .logo-container {
      position: relative;
      margin-top: auto;
      margin-bottom: auto;
      display: flex;
      flex-direction: column;
      align-items: center;
      z-index: 10;
    }

    .logo-wrapper {
      position: relative;
      width: 250px;
      height: 250px;
      transform: scale(0);
      animation: logoElasticIn 1s 0.35s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    @keyframes logoElasticIn {
      0% { transform: scale(0) rotate(-15deg); opacity: 0; }
      60% { transform: scale(1.08) rotate(3deg); opacity: 1; }
      80% { transform: scale(0.96) rotate(-1deg); }
      100% { transform: scale(1) rotate(0deg); opacity: 1; }
    }

    .logo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 15px 30px rgba(0, 0, 0, 0.7)) drop-shadow(0 0 25px rgba(0, 168, 107, 0.6));
      user-select: none;
    }

    /* Effet de balayage de brillance (Shimmer sweep) */
    .shimmer-effect {
      position: absolute;
      inset: 0;
      border-radius: 50%;
      background: linear-gradient(
        105deg,
        transparent 30%,
        rgba(255, 255, 255, 0.65) 50%,
        transparent 70%
      );
      transform: translateX(-150%);
      pointer-events: none;
      animation: sweepShimmer 2.2s 1.2s infinite;
    }

    @keyframes sweepShimmer {
      0% { transform: translateX(-150%); }
      40%, 100% { transform: translateX(150%); }
    }

    /* Lévitation continue après apparition */
    .floating-box {
      animation: gentleFloat 3.5s 1.5s ease-in-out infinite alternate;
    }

    @keyframes gentleFloat {
      0% { transform: translateY(0px); }
      100% { transform: translateY(-8px); }
    }

    /* Slogan de marque */
    .brand-tagline {
      margin-top: 24px;
      font-size: 15px;
      font-weight: 700;
      letter-spacing: 2px;
      text-transform: uppercase;
      color: #A3E635;
      text-align: center;
      opacity: 0;
      transform: translateY(15px);
      animation: fadeInText 0.8s 0.8s ease-out forwards;
      text-shadow: 0 0 15px rgba(163, 230, 53, 0.4);
    }

    .brand-subline {
      margin-top: 6px;
      font-size: 13px;
      font-weight: 500;
      color: #94A3B8;
      text-align: center;
      opacity: 0;
      transform: translateY(15px);
      animation: fadeInText 0.8s 1.0s ease-out forwards;
    }

    @keyframes fadeInText {
      0% { opacity: 0; transform: translateY(15px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* Bloc d'Appel à l'Action (CTA) */
    .cta-card {
      width: 100%;
      background: rgba(13, 22, 33, 0.85);
      border: 1px solid rgba(0, 168, 107, 0.3);
      backdrop-filter: blur(16px);
      border-radius: 24px;
      padding: 22px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
      z-index: 10;
      opacity: 0;
      transform: translateY(30px);
      animation: slideUpCard 0.9s 1.1s cubic-bezier(0.16, 1, 0.3, 1) forwards;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.1);
    }

    @keyframes slideUpCard {
      0% { opacity: 0; transform: translateY(30px); }
      100% { opacity: 1; transform: translateY(0); }
    }

    /* Numéro WhatsApp géant */
    .whatsapp-pill {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #FFFFFF;
      color: #075E54;
      padding: 10px 22px;
      border-radius: 50px;
      font-size: 19px;
      font-weight: 900;
      letter-spacing: 0.5px;
      box-shadow: 0 6px 25px rgba(255, 255, 255, 0.25);
      animation: pulsePhone 2s 2s infinite ease-in-out;
    }

    @keyframes pulsePhone {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }

    .wa-icon {
      width: 22px;
      height: 22px;
      fill: #25D366;
    }

    /* Grille des 2 actions 1-clic */
    .action-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 12px;
      width: 100%;
    }

    .action-btn {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 12px 10px;
      border-radius: 16px;
      text-decoration: none;
      font-weight: 700;
      text-align: center;
      transition: transform 0.2s;
    }

    .btn-rider {
      background: linear-gradient(135deg, #00A86B 0%, #075E54 100%);
      color: #FFFFFF;
      border: 1px solid rgba(0, 255, 157, 0.4);
      box-shadow: 0 4px 15px rgba(0, 168, 107, 0.3);
    }

    .btn-vendor {
      background: rgba(255, 255, 255, 0.08);
      color: #FFFFFF;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .action-badge {
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.85;
      margin-bottom: 3px;
    }

    .action-keyword {
      font-size: 14px;
      font-weight: 900;
      color: #FFD700;
    }

    .btn-vendor .action-keyword {
      color: #38BDF8;
    }

    /* Pied de page discret */
    .footer-note {
      font-size: 11px;
      color: #64748B;
      text-align: center;
      margin-top: 8px;
      letter-spacing: 0.5px;
    }

    /* Bouton replay de contrôle (non exporté) */
    .replay-bar {
      position: absolute;
      top: 15px;
      right: 15px;
      z-index: 100;
    }

    .btn-replay {
      background: rgba(255, 255, 255, 0.15);
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #FFF;
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      backdrop-filter: blur(8px);
      transition: background 0.2s;
    }

    .btn-replay:hover {
      background: rgba(0, 168, 107, 0.5);
    }
  </style>
</head>
<body>

  <div class="viewport" id="outroViewport">
    <div class="replay-bar">
      <button class="btn-replay" onclick="replayAnimation()">🔄 Rejouer</button>
    </div>

    <!-- Effets d'ambiance -->
    <div class="tech-grid"></div>
    <div class="glow-aura"></div>
    <div class="shockwave"></div>
    <div class="lightning-streak"></div>

    <!-- Cœur : Logo Officiel Canonique WAZAP -->
    <div class="logo-container floating-box">
      <div class="logo-wrapper">
        <img 
          src="../logo_officiel_transparent.png" 
          alt="Logo Officiel WAZAP" 
          class="logo-img"
        />
        <div class="shimmer-effect"></div>
      </div>
      <div class="brand-tagline">La livraison en direct à Abidjan</div>
      <div class="brand-subline">Zéro commission · Suivi GPS · Paiement QR Code</div>
    </div>

    <!-- Cartouche d'Action & Contacts -->
    <div class="cta-card">
      <div class="whatsapp-pill">
        <svg class="wa-icon" viewBox="0 0 24 24">
          <path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/>
        </svg>
        <span>05 44 05 19 72</span>
      </div>

      <div class="action-grid">
        <div class="action-btn btn-rider">
          <span class="action-badge">🛵 LIVREURS</span>
          <span class="action-keyword">Envoie DISPO</span>
        </div>
        <div class="action-btn btn-vendor">
          <span class="action-badge">🏪 COMMERÇANTS</span>
          <span class="action-keyword">Envoie COLIS</span>
        </div>
      </div>

      <div class="footer-note">
        wazap.ci · Abidjan, Côte d'Ivoire · © 2026 WAZAP
      </div>
    </div>
  </div>

  <script>
    function replayAnimation() {
      const container = document.getElementById('outroViewport');
      const clone = container.cloneNode(true);
      container.parentNode.replaceChild(clone, container);
    }
  </script>
</body>
</html>
