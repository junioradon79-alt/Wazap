<svg xmlns="http://www.w3.org/2000/svg" width="360" height="700" viewBox="0 0 360 700">
  <defs>
    <linearGradient id="pframe" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#3d4650"/>
      <stop offset="0.35" stop-color="#1a1f25"/>
      <stop offset="0.75" stop-color="#0e1216"/>
      <stop offset="1" stop-color="#2b333c"/>
    </linearGradient>
    <linearGradient id="pscreen" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#064a2a"/>
      <stop offset="0.45" stop-color="#0e7a3e"/>
      <stop offset="1" stop-color="#07c05a"/>
    </linearGradient>
    <linearGradient id="pshine" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.30"/>
      <stop offset="0.45" stop-color="#ffffff" stop-opacity="0.05"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="pglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#07c05a" stop-opacity="0.55"/>
      <stop offset="0.6" stop-color="#07c05a" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#07c05a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pgold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe79a"/>
      <stop offset="1" stop-color="#e0a83a"/>
    </linearGradient>
  </defs>

  <ellipse cx="180" cy="360" rx="330" ry="420" fill="url(#pglow)"/>

  <!-- châssis premium -->
  <rect x="18" y="8" width="324" height="684" rx="52" fill="url(#pframe)"/>
  <rect x="18" y="8" width="324" height="684" rx="52" fill="none" stroke="#6d7885" stroke-width="2" opacity="0.55"/>
  <rect x="30" y="20" width="300" height="660" rx="42" fill="#05070a"/>
  <rect x="40" y="30" width="280" height="640" rx="34" fill="url(#pscreen)"/>

  <!-- écran : contenu WAZAP -->
  <circle cx="180" cy="215" r="78" fill="#ffffff" opacity="0.14"/>
  <circle cx="180" cy="215" r="78" fill="none" stroke="#ffffff" stroke-width="4" opacity="0.45"/>
  <circle cx="180" cy="215" r="56" fill="#ffffff" opacity="0.92"/>
  <text x="180" y="238" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="62" font-weight="bold" fill="#0e7a3e">⚡</text>
  <text x="180" y="345" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="52" font-weight="800" fill="#ffffff" letter-spacing="1">WAZAP</text>
  <text x="180" y="382" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="21" font-weight="600" fill="#d8f5e4">LIVREUR AMBASSADEUR</text>

  <!-- barre de progression -->
  <rect x="70" y="420" width="220" height="18" rx="9" fill="#00301a" opacity="0.55"/>
  <rect x="70" y="420" width="220" height="18" rx="9" fill="url(#pgold)"/>
  <text x="180" y="470" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="17" font-weight="700" fill="#ffffff">250 LIVRAISONS · 5 FILLEULS</text>

  <!-- récompense -->
  <rect x="68" y="498" width="224" height="64" rx="16" fill="#ffffff" opacity="0.95"/>
  <text x="180" y="540" text-anchor="middle" font-family="Segoe UI,Arial,sans-serif" font-size="20" font-weight="800" fill="#0e7a3e">📱 SMARTPHONE</text>

  <!-- reflet verre -->
  <path d="M60 40 L200 40 L96 650 L40 650 Z" fill="url(#pshine)"/>

  <!-- poinçon caméra + boutons -->
  <circle cx="180" cy="48" r="7" fill="#05070a"/>
  <rect x="340" y="200" width="5" height="52" rx="2.5" fill="#6d7885"/>
  <rect x="340" y="266" width="5" height="34" rx="2.5" fill="#6d7885"/>
  <rect x="15" y="230" width="5" height="70" rx="2.5" fill="#6d7885"/>

  <!-- connecteur -->
  <rect x="146" y="686" width="68" height="5" rx="2.5" fill="#5c6672"/>
</svg>
