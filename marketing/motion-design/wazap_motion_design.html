<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>WAZAP — Motion Design Officiel 20s (TikTok 9:16)</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800;900&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: #03070b;
      color: #fff;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* Container de présentation 9:16 */
    .motion-wrapper {
      position: relative;
      width: 100vw;
      max-width: 480px;
      height: calc(100vw * 16 / 9);
      max-height: 853px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 0 60px rgba(0, 168, 107, 0.3), 0 20px 50px rgba(0, 0, 0, 0.9);
      border-radius: 20px;
      overflow: hidden;
      background: #000;
    }

    /* Canvas de rendu 1080 x 1920 natif */
    canvas#stage {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
    }

    /* Contrôles du lecteur interactif */
    .player-controls {
      position: absolute;
      bottom: 12px;
      left: 12px;
      right: 12px;
      background: rgba(8, 17, 25, 0.85);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(0, 168, 107, 0.4);
      border-radius: 14px;
      padding: 10px 14px;
      display: flex;
      align-items: center;
      gap: 12px;
      z-index: 100;
      transition: opacity 0.3s ease;
    }

    .player-controls:hover, .player-controls.active {
      opacity: 1;
    }

    .play-btn {
      background: #00A86B;
      border: none;
      color: #fff;
      width: 36px;
      height: 36px;
      border-radius: 50%;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      font-size: 16px;
      box-shadow: 0 0 15px rgba(0, 168, 107, 0.5);
      transition: transform 0.15s ease, background 0.2s ease;
      flex-shrink: 0;
    }

    .play-btn:hover {
      transform: scale(1.08);
      background: #00d186;
    }

    .timeline-container {
      flex: 1;
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .timeline-bar {
      position: relative;
      width: 100%;
      height: 6px;
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
      cursor: pointer;
      overflow: hidden;
    }

    .timeline-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, #00A86B, #00FF9D);
      border-radius: 3px;
    }

    .time-info {
      display: flex;
      justify-content: space-between;
      font-size: 11px;
      font-weight: 700;
      color: #94A3B8;
      letter-spacing: 0.5px;
    }

    .sound-btn {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.2);
      color: #fff;
      width: 32px;
      height: 32px;
      border-radius: 8px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      font-size: 14px;
      flex-shrink: 0;
    }

    /* Header d'info hors champ */
    .top-badge-info {
      position: absolute;
      top: 15px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0, 0, 0, 0.6);
      border: 1px solid rgba(0, 255, 157, 0.3);
      padding: 4px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      color: #00FF9D;
      letter-spacing: 1px;
      text-transform: uppercase;
      pointer-events: none;
      z-index: 10;
    }
  </style>
</head>
<body>

  <div class="motion-wrapper">
    <div class="top-badge-info">WAZAP • 20s MOTION DESIGN 9:16</div>
    <canvas id="stage" width="1080" height="1920"></canvas>

    <div class="player-controls" id="controls">
      <button class="play-btn" id="playBtn">▶</button>
      <div class="timeline-container">
        <div class="timeline-bar" id="timelineBar">
          <div class="timeline-fill" id="timelineFill"></div>
        </div>
        <div class="time-info">
          <span id="currentTime">00:00</span>
          <span id="durationTime">00:20</span>
        </div>
      </div>
      <button class="sound-btn" id="soundBtn">🔊</button>
    </div>
  </div>

  <audio id="audioTrack" src="audio/master_soundtrack_20s.aac" preload="auto"></audio>

  <script>
    // Configuration globale du Motion Design
    const TOTAL_DURATION = 20.0; // secondes exactes
    const FPS = 30;
    const TOTAL_FRAMES = Math.round(TOTAL_DURATION * FPS); // 600 frames
    const WIDTH = 1080;
    const HEIGHT = 1920;

    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d', { alpha: false });
    const audio = document.getElementById('audioTrack');
    const playBtn = document.getElementById('playBtn');
    const soundBtn = document.getElementById('soundBtn');
    const timelineBar = document.getElementById('timelineBar');
    const timelineFill = document.getElementById('timelineFill');
    const currentTimeEl = document.getElementById('currentTime');
    const controls = document.getElementById('controls');

    let currentFrame = 0;
    let isPlaying = false;
    let isMuted = false;
    let animReq = null;
    let lastTimestamp = 0;

    // Détection mode headless
    const urlParams = new URLSearchParams(window.location.search);
    const isHeadless = urlParams.get('headless') === 'true';

    if (isHeadless) {
      controls.style.display = 'none';
      document.querySelector('.top-badge-info').style.display = 'none';
    }

    // Chargement des images clés
    const assets = {
      logo: new Image(),
      qrCode: new Image()
    };

    assets.logo.src = '../visuels/logo_officiel_transparent.png';
    assets.qrCode.src = '../programmation-60jours/assets/qr_universel_wazap.png';

    let assetsLoaded = false;
    let loadCount = 0;
    const totalAssets = 2;

    function onAssetLoad() {
      loadCount++;
      if (loadCount >= totalAssets) {
        assetsLoaded = true;
        renderFrame(0);
        if (isHeadless) {
          window.startHeadlessRender();
        }
      }
    }

    assets.logo.onload = onAssetLoad;
    assets.qrCode.onload = onAssetLoad;
    assets.logo.onerror = onAssetLoad;
    assets.qrCode.onerror = onAssetLoad;

    // Fonctions d'Easing cinématiques
    function clamp(v, min = 0, max = 1) { return Math.max(min, Math.min(max, v)); }
    function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
    function easeInOutCubic(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
    function easeOutBack(t) {
      const c1 = 1.70158;
      const c3 = c1 + 1;
      return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
    }
    function easeOutQuad(t) { return 1 - (1 - t) * (1 - t); }

    // Particules animées en arrière-plan
    const particles = [];
    for (let i = 0; i < 45; i++) {
      particles.push({
        x: Math.random() * WIDTH,
        y: Math.random() * HEIGHT,
        size: 2 + Math.random() * 5,
        speedY: -1 - Math.random() * 2.5,
        speedX: (Math.random() - 0.5) * 1.5,
        alpha: 0.2 + Math.random() * 0.6,
        color: i % 3 === 0 ? '#00FF9D' : (i % 3 === 1 ? '#00A86B' : '#FFD700')
      });
    }

    // =========================================================================
    // DESSIN DU MOTION DESIGN (PAR SECONDES / FRAMES DETERMINISTES)
    // =========================================================================
    function drawMotionDesign(t, f) {
      // Nettoyage fond Obsidian profond
      ctx.fillStyle = '#060B11';
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      // 1. Fond dynamique & Grille Cyber-Emerald
      drawDynamicBackground(t);

      // 2. SCÈNES CHORÉGRAPHIÉES (0.0s à 20.0s)
      if (t >= 0.0 && t < 3.8) {
        drawScene1_Hook(t);
      } else if (t >= 3.8 && t < 8.2) {
        drawScene2_Solution(t);
      } else if (t >= 8.2 && t < 12.8) {
        drawScene3_QRCodeUniversel(t);
      } else if (t >= 12.8 && t < 16.5) {
        drawScene4_Offres(t);
      } else {
        drawScene5_Outro(t);
      }

      // 3. Transitions globales & Flashs cinématiques
      drawTransitions(t);

      // 4. Filigrane discret et sécurisation du cadre
      drawGlobalHeader(t);
    }

    // -------------------------------------------------------------------------
    // FOND DYNAMIQUE UNIVERSEL
    // -------------------------------------------------------------------------
    function drawDynamicBackground(t) {
      ctx.save();
      // Dégradé radial émeraude au centre
      const pulse = Math.sin(t * 3) * 0.15 + 0.85;
      const bgGrad = ctx.createRadialGradient(WIDTH / 2, HEIGHT * 0.45, 50, WIDTH / 2, HEIGHT * 0.45, 850);
      bgGrad.addColorStop(0, `rgba(0, 80, 50, ${0.45 * pulse})`);
      bgGrad.addColorStop(0.5, `rgba(4, 25, 18, ${0.3 * pulse})`);
      bgGrad.addColorStop(1, 'rgba(6, 11, 17, 1)');
      ctx.fillStyle = bgGrad;
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      // Grille tech en perspective
      ctx.strokeStyle = 'rgba(0, 168, 107, 0.06)';
      ctx.lineWidth = 1.5;
      const gridSize = 60;
      const offsetY = (t * 40) % gridSize;
      for (let y = offsetY; y < HEIGHT; y += gridSize) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(WIDTH, y);
        ctx.stroke();
      }
      for (let x = 0; x < WIDTH; x += gridSize) {
        ctx.beginPath();
        ctx.moveTo(x, 0);
        ctx.lineTo(x, HEIGHT);
        ctx.stroke();
      }

      // Particules flottantes
      particles.forEach((p, idx) => {
        const py = (p.y + p.speedY * t * 30) % HEIGHT;
        const finalY = py < 0 ? py + HEIGHT : py;
        const px = (p.x + p.speedX * t * 30 + Math.sin(t * 2 + idx) * 20) % WIDTH;
        const finalX = px < 0 ? px + WIDTH : px;

        ctx.fillStyle = p.color;
        ctx.globalAlpha = p.alpha * (0.5 + 0.5 * Math.sin(t * 4 + idx));
        ctx.beginPath();
        ctx.arc(finalX, finalY, p.size, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1.0;
      ctx.restore();
    }

    // -------------------------------------------------------------------------
    // SCÈNE 1 (0.0s à 3.8s) : LE HOOK & LA DOULEUR E-COMMERCE
    // -------------------------------------------------------------------------
    function drawScene1_Hook(t) {
      ctx.save();
      const localT = t; // 0.0 à 3.8s

      // Lueur d'alerte rouge/ambre au début
      const alertPulse = Math.sin(localT * 8) * 0.2 + 0.5;
      const alertGlow = ctx.createRadialGradient(WIDTH / 2, 450, 50, WIDTH / 2, 450, 600);
      alertGlow.addColorStop(0, `rgba(220, 38, 38, ${0.35 * alertPulse})`);
      alertGlow.addColorStop(1, 'rgba(0, 0, 0, 0)');
      ctx.fillStyle = alertGlow;
      ctx.fillRect(0, 0, WIDTH, HEIGHT);

      // 1. Badge d'urgence supérieur (0.1s)
      const p1 = clamp((localT - 0.1) / 0.4);
      if (p1 > 0) {
        const scale = easeOutBack(p1);
        ctx.save();
        ctx.translate(WIDTH / 2, 280);
        ctx.scale(scale, scale);
        drawPillBadge('⚠️ COMMERÇANTS & VENDEUSES D\'ABIDJAN', '#EF4444', '#7F1D1D');
        ctx.restore();
      }

      // 2. Kinetic Typography — Staggered Big Words
      // "FINI LES LIVREURS" (0.3s)
      const p2 = clamp((localT - 0.3) / 0.4);
      if (p2 > 0) {
        const offY = (1 - easeOutCubic(p2)) * 60;
        ctx.save();
        ctx.globalAlpha = p2;
        ctx.textAlign = 'center';
        ctx.font = '900 68px "Plus Jakarta Sans", sans-serif';
        ctx.fillStyle = '#FFFFFF';
        ctx.shadowColor = 'rgba(0, 0, 0, 0.9)';
        ctx.shadowBlur = 20;
        ctx.fillText('FINI LES LIVREURS', WIDTH / 2, 440 + offY);
        ctx.restore();
      }

      // "QUI DISPARAISSENT" (0.7s)
      const p3 = clamp((localT - 0.7) / 0.4);
      if (p3 > 0) {
        const shake = localT < 2.5 ? Math.sin(localT * 30) * 3 : 0;
        const scale = easeOutBack(p3);
        ctx.save();
        ctx.translate(WIDTH / 2 + shake, 540);
        ctx.scale(scale, scale);
        ctx.textAlign = 'center';
        ctx.font = '900 76px "Plus Jakarta Sans", sans-serif';
        ctx.fillStyle = '#F87171';
        ctx.shadowColor = 'rgba(239, 68, 68, 0.8)';
        ctx.shadowBlur = 35;
        ctx.fillText('QUI DISPARAISSENT', 0, 0);
        ctx.restore();
      }

      // "AVEC VOTRE ARGENT !" (1.1s)
      const p4 = clamp((localT - 1.1) / 0.4);
      if (p4 > 0) {
        const scale = easeOutBack(p4);
        ctx.save();
        ctx.translate(WIDTH / 2, 650);
        ctx.scale(scale, scale);
        ctx.textAlign = 'center';
        ctx.font = '900 78px "Plus Jakarta Sans", sans-serif';
        ctx.fillStyle = '#FBBF24';
        ctx.shadowColor = 'rgba(251, 191, 36, 0.9)';
        ctx.shadowBlur = 40;
        ctx.fillText('AVEC VOTRE ARGENT !', 0, 0);
        ctx.restore();
      }

      // 3. Carte Graphique Centrale — 3D Cash bloqué & Barré (1.5s à 3.5s)
      const p5 = clamp((localT - 1.4) / 0.5);
      if (p5 > 0) {
        const cardScale = easeOutBack(p5);
        ctx.save();
        ctx.translate(WIDTH / 2, 1080);
        ctx.scale(cardScale, cardScale);

        // Panneau verre dépoli sombre
        ctx.fillStyle = 'rgba(15, 23, 42, 0.85)';
        ctx.strokeStyle = 'rgba(239, 68, 68, 0.5)';
        ctx.lineWidth = 4;
        drawRoundRect(ctx, -440, -280, 880, 560, 32);
        ctx.fill();
        ctx.stroke();

        // Symbole d'alerte et billets
        ctx.font = '900 130px "Plus Jakarta Sans", sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('💵 🏍️ 💨', 0, -80);

        // Barre diagonale rouge animée "INTERDIT / BARRÉ"
        const pSlash = clamp((localT - 1.8) / 0.4);
        if (pSlash > 0) {
          ctx.strokeStyle = '#EF4444';
          ctx.lineWidth = 14;
          ctx.beginPath();
          ctx.arc(0, -90, 140, 0, Math.PI * 2);
          ctx.stroke();

          ctx.beginPath();
          ctx.moveTo(-100, -190);
          ctx.lineTo(100, 10);
          ctx.stroke();
        }

        // Texte d'impact sur la carte
        ctx.font = '800 38px "Plus Jakarta Sans", sans-serif';
        ctx.fillStyle = '#FFFFFF';
        ctx.fillText('LE STRESS DES ENCAISSEMENTS', 0, 120);

        ctx.font = '700 30px "Plus Jakarta Sans", sans-serif';
        ctx.fillStyle = '#F87171';
        ctx.fillText('Courses annulées • Argent non reversé', 0, 180);

        // Badge 100% Zéro manipulation d'espèces
        ctx.save();
        ctx.translate(0, 235);
        drawPillBadge('🚫 ZÉRO MANIPULATION D\'ESPÈCES', '#EF4444', 'rgba(239, 68, 68, 0.2)');
        ctx.restore();

        ctx.restore();
      }

      // 4. Micro-étiquette d'espoir en bas (2.2s)
      const p6 = clamp((localT - 2.2) / 0.4);
      if (p6 > 0) {
        ctx.save();
        ctx.globalAlpha = p6;
        ctx.textAlign = 'center';
        ctx.font = '800 36px "Plus Jakarta Sans", sans-serif';
        ctx.fillStyle = '#00FF9D';
        ctx.shadowColor = 'rgba(0, 255, 157, 0.8)';
        ctx.shadowBlur = 20;
        ctx.fillText('IL EXISTE UNE SOLUTION SÛRE À 100% 👇', WIDTH / 2, 1620);
        ctx.restore();
      }

      ctx.restore();
    }

    // -------------------------------------------------------------------------
    // SCÈNE 2 (3.8s à 8.2s) : LA RÉVÉLATION WAZAP (100% WHATSAPP / ZÉRO APPLI)
    // -------------------------------------------------------------------------
    function drawScene2_Solution(t) {
      ctx.save();
      const localT = t - 3.8; // 0.0 à 4.4s

      // Flash émeraude initial (3.8s)
      const flash = clamp(1 - localT / 0.5);
      if (flash > 0) {
        ctx.fillStyle = `rgba(0, 255, 157, ${flash * 0.4})`;
        ctx.fillRect(0, 0, WIDTH, HEIGHT);
      }

      // 1. Badge supérieur
      const p1 = clamp(localT / 0.4);
      if (p1 > 0) {
        ctx.save();
        ctx.translate(WIDTH / 2, 220);
        ctx.scale(easeOutBack(p1), easeOutBack(p1));
        drawPillBadge('⚡ LA NOUVELLE FAÇON DE LIVRER À ABIDJAN', '#00FF9D', '#064E3B');
        ctx.restore();
      }

      // 2. Révélation du Logo WAZAP Officiel Canonique (0.2s)
      const pLogo = clamp((localT - 0.2) / 0.5);
      if (pLogo > 0) {
        const logoScale = easeOutBack(pLogo);
        ctx.save();
        ctx.translate(WIDTH / 2, 400);
        ctx.scale(logoScale, logoScale);

        // Halo lumineux vert pulsant
        const auraPulse = Math.sin(localT * 5) * 20 + 180;
        const aura = ctx.createRadialGradient(0, 0, 40, 0, 0, auraPulse);
        aura.addColorStop(0, 'rgba(0, 255, 157, 0.6)');
        aura.addColorStop(0.6, 'rgba(0, 168, 107, 0.2)');
        aura.addColorStop(1, 'rgba(0, 0, 0, 0)');
        ctx.fillStyle = aura;
        ctx.beginPath();
        ctx.arc(0, 0, auraPulse, 0, Math.PI * 2);
        ctx.fill();

        // Dessin du véritable logo canonique
        if (assets.logo.complete && assets.logo.naturalWidth > 0) {
          const logoW = 260;
          const logoH = 260;
          ctx.drawImage(assets.logo, -logoW / 2, -logoH / 2, logoW, logoH);
        } else {
          // Fallback visuel strict
          ctx.fillStyle = '#00A86B';
          ctx.beginPath();
          ctx.arc(0, 0, 110, 0, Math.PI * 2);
          ctx.fill();
          ctx.fillStyle = '#FFF';
          ctx.font = '900 48px sans-serif';
          ctx.textAlign = 'center';
          ctx.fillText('WAZAP', 0, 18);
        }
        ctx.restore();
      }

      // 3. Titre d'impact "100% WHATSAPP • ZÉRO APPLI" (0.6s)
      const pTitle = clamp((localT - 0.6) / 0.4);
      if (pTitle > 0) {
        ctx.save();
        ctx.globalAlpha = pTitle;
        ctx.textAlign = 'center';
        ctx.font = '900 62px "Plus Jakarta Sans", sans-serif';
        ctx.fillStyle = '#FFFFFF';
        ctx.fillText('TOUT SE PASSE DANS', WIDTH / 2, 600);

        ctx.font = '900 78px "Plus Jakarta Sans", sans-serif';
        ctx.fillStyle = '#25D366';
        ctx.shadowColor = 'rgba(37, 211, 102, 0.8)';
        ctx.shadowBlur = 30;
        ctx.fillText('VOTRE WHATSAPP !', WIDTH / 2, 680);
        ctx.restore();
      }

      // 4. Mockup Smartphone Interactif avec Interface WhatsApp Réelle (1.2s à 4.4s)
      const pPhone = clamp((localT - 1.0) / 0.6);
      if (pPhone > 0) {
        const phoneY = 1220 - (1 - easeOutCubic(pPhone)) * 300;
        ctx.save();
        ctx.translate(WIDTH / 2, phoneY);

        // Boîtier smartphone noir / émeraude
        ctx.fillStyle = '#0F172A';
        ctx.strokeStyle = '#00A86B';
        ctx.lineWidth = 6;
        ctx.shadowColor = 'rgba(0, 168, 107, 0.4)';
        ctx.shadowBlur = 40;
        drawRoundRect(ctx, -380, -360, 760, 680, 40);
        ctx.fill();
        ctx.stroke();

        // En-tête WhatsApp vert émeraude officiel
        ctx.fillStyle = '#075E54';
        drawRoundRect(ctx, -374, -354, 748, 110, 36);
        ctx.fill();

        // Profil WAZAP
        ctx.fillStyle = '#25D366';
        ctx.beginPath();
        ctx.arc(-290, -300, 32, 0, Math.PI * 2);
        ctx.fill();

        ctx.fillStyle = '#FFFFFF';
        ctx.font = '900 32px "Plus Jakarta Sans", sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText('WAZAP Officiel 🟢', -230, -308);

        ctx.font = '600 22px "Plus Jakarta Sans", sans-serif';
        ctx.fillStyle = '#A7F3D0';
        ctx.fillText('+225 05 44 05 19 72 • En ligne', -230, -276);

        // Bulle de message WhatsApp 1 (1.5s) : Course attribuée
        const pBubble1 = clamp((localT - 1.5) / 0.4);
        if (pBubble1 > 0) {
          ctx.save();
          ctx.scale(easeOutBack(pBubble1), easeOutBack(pBubble1));
          ctx.fillStyle = '#005C4B'; // Vert bulle WhatsApp entrant
          drawRoundRect(ctx, -340, -210, 660, 120, 20);
          ctx.fill();

          ctx.fillStyle = '#FFFFFF';
          ctx.font = '700 28px "Plus Jakarta Sans", sans-serif';
          ctx.fillText('🚀 Course acceptée en 1 tap !', -310, -165);
          ctx.font = '500 24px "Plus Jakarta Sans", sans-serif';
          ctx.fillStyle = '#D1FAE5';
          ctx.fillText('Livreur certifié en route vers votre boutique (3 min).', -310, -125);
          ctx.restore();
        }

        // Bulle de message WhatsApp 2 (2.2s) : Scellé Colis Sûr
        const pBubble2 = clamp((localT - 2.2) / 0.4);
        if (pBubble2 > 0) {
          ctx.save();
          ctx.scale(easeOutBack(pBubble2), easeOutBack(pBubble2));
          ctx.fillStyle = '#1F2937';
          drawRoundRect(ctx, -340, -60, 660, 100, 20);
          ctx.fill();

          ctx.fillStyle = '#FFD700';
          ctx.font = '800 26px "Plus Jakarta Sans", sans-serif';
          ctx.fillText('🛡️ Scellé Colis Sûr N° WZ-2026 activé', -310, -20);
          ctx.fillStyle = '#94A3B8';
          ctx.font = '500 22px "Plus Jakarta Sans", sans-serif';
          ctx.fillText('Règlement exclusif par QR Code Universel à l\'arrivée.', -310, 15);
          ctx.restore();
        }

        // 3 Pilules d'avantages en bas du smartphone (2.8s)
        const pPills = clamp((localT - 2.8) / 0.4);
        if (pPills > 0) {
          ctx.save();
          ctx.translate(0, 150);
          ctx.scale(easeOutBack(pPills), easeOutBack(pPills));

          drawPillFeature(-230, 0, '📲 100% WhatsApp', '#00FF9D');
          drawPillFeature(0, 0, '⚡ Zéro Application', '#38BDF8');
          drawPillFeature(230, 0, '👆 1-Tap : Zéro Saisie', '#FBBF24');
          ctx.restore();
        }

        ctx.restore();
      }

      ctx.restore();
    }

    // -------------------------------------------------------------------------

        ctx.strokeStyle = '#00FF9D';

    // -------------------------------------------------------------------------
    // COMPOSANTS & HELPERS GRAPHIQUES
    // -------------------------------------------------------------------------
    function drawPillBadge(text, strokeColor, fillColor) {
      ctx.save();
      ctx.font = '800 28px "Plus Jakarta Sans", sans-serif';
      const textWidth = ctx.measureText(text).width;
      const padX = 36;
      const h = 64;
      const w = textWidth + padX * 2;

      ctx.fillStyle = fillColor;
      ctx.strokeStyle = strokeColor;
      ctx.lineWidth = 3;
      ctx.shadowColor = strokeColor;
      ctx.shadowBlur = 20;
      drawRoundRect(ctx, -w / 2, -h / 2, w, h, h / 2);
      ctx.fill();
      ctx.stroke();

      ctx.textAlign = 'center';
      ctx.fillStyle = strokeColor;
      ctx.fillText(text, 0, 10);
      ctx.restore();
    }

    function drawPillFeature(x, y, text, color) {
      ctx.save();
      ctx.translate(x, y);
      ctx.fillStyle = 'rgba(15, 23, 42, 0.9)';
      ctx.strokeStyle = color;
      ctx.lineWidth = 2;
      drawRoundRect(ctx, -105, -28, 210, 56, 28);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = color;
      ctx.font = '800 20px "Plus Jakarta Sans", sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(text, 0, 7);
      ctx.restore();
    }

    function drawScanCorner(context, x, y, dx, dy, color) {
      context.save();
      context.strokeStyle = color;
      context.lineWidth = 8;
      context.lineCap = 'round';
      context.beginPath();
      context.moveTo(x + dx, y);
      context.lineTo(x, y);
      context.lineTo(x, y + dy);
      context.stroke();
      context.restore();
    }

    function drawRoundRect(context, x, y, width, height, radius) {
      context.beginPath();
      context.moveTo(x + radius, y);
      context.lineTo(x + width - radius, y);
      context.quadraticCurveTo(x + width, y, x + width, y + radius);
      context.lineTo(x + width, y + height - radius);
      context.quadraticCurveTo(x + width, y + height, x + width - radius, y + height);
      context.lineTo(x + radius, y + height);
      context.quadraticCurveTo(x, y + height, x, y + height - radius);
      context.lineTo(x, y + radius);
      context.quadraticCurveTo(x, y, x + radius, y);
      context.closePath();
    }

    function drawTransitions(t) {
      // Flashs de transitions entre chapitres
      const flashPoints = [3.8, 8.2, 12.8, 16.5];
      flashPoints.forEach(pt => {
        if (t >= pt && t < pt + 0.3) {
          const alpha = 1 - (t - pt) / 0.3;
          ctx.fillStyle = `rgba(0, 255, 157, ${alpha * 0.35})`;
          ctx.fillRect(0, 0, WIDTH, HEIGHT);
        }
      });
    }

    function drawGlobalHeader(t) {
      // Filigrane discret en haut
      ctx.save();
      ctx.font = '700 22px "Plus Jakarta Sans", sans-serif';
      ctx.fillStyle = 'rgba(148, 163, 184, 0.4)';
      ctx.textAlign = 'center';
      ctx.fillText('WAZAP.CI • ABIDJAN SÉCURITÉ 100%', WIDTH / 2, 70);
      ctx.restore();
    }

    // =========================================================================
    // MOTEUR D'EXÉCUTION & CONTRÔLE
    // =========================================================================
    function renderFrame(frameIndex) {
      currentFrame = Math.max(0, Math.min(TOTAL_FRAMES - 1, frameIndex));
      const t = currentFrame / FPS;
      drawMotionDesign(t, currentFrame);

      // Mise à jour de l'UI
      const pct = (currentFrame / (TOTAL_FRAMES - 1)) * 100;
      timelineFill.style.width = pct + '%';
      const sec = Math.floor(t);
      const cent = Math.floor((t - sec) * 100);
      currentTimeEl.textContent = `00:${String(sec).padStart(2, '0')}`;
    }

    function loop(timestamp) {
      if (!isPlaying) return;
      if (!lastTimestamp) lastTimestamp = timestamp;
      const delta = (timestamp - lastTimestamp) / 1000;
      lastTimestamp = timestamp;

      // Avancement
      currentFrame += delta * FPS;
      if (currentFrame >= TOTAL_FRAMES) {
        currentFrame = TOTAL_FRAMES - 1;
        pause();
      } else {
        renderFrame(Math.round(currentFrame));
        animReq = requestAnimationFrame(loop);
      }
    }

    function play() {
      if (currentFrame >= TOTAL_FRAMES - 1) {
        currentFrame = 0;
      }
      isPlaying = true;
      playBtn.textContent = '⏸';
      lastTimestamp = 0;
      if (!isMuted) {
        audio.currentTime = currentFrame / FPS;
        audio.play().catch(() => {});
      }
      animReq = requestAnimationFrame(loop);
    }

    function pause() {
      isPlaying = false;
      playBtn.textContent = '▶';
      audio.pause();
      if (animReq) cancelAnimationFrame(animReq);
    }

    playBtn.addEventListener('click', () => {
      if (isPlaying) pause();
      else play();
    });

    soundBtn.addEventListener('click', () => {
      isMuted = !isMuted;
      soundBtn.textContent = isMuted ? '🔇' : '🔊';
      if (isMuted) audio.pause();
      else if (isPlaying) audio.play().catch(() => {});
    });

    timelineBar.addEventListener('click', (e) => {
      const rect = timelineBar.getBoundingClientRect();
      const pos = (e.clientX - rect.left) / rect.width;
      currentFrame = Math.round(pos * (TOTAL_FRAMES - 1));
      renderFrame(currentFrame);
      if (isPlaying) {
        audio.currentTime = currentFrame / FPS;
      }
    });

    // Rendu automatique mode Headless (export direct vers le backend)
    window.startHeadlessRender = async function() {
      console.log(`[HEADLESS] Démarrage du rendu des ${TOTAL_FRAMES} frames HD 1080x1920...`);
      for (let f = 0; f < TOTAL_FRAMES; f++) {
        renderFrame(f);
        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/jpeg', 0.94));
        await fetch('/upload-frame?frame=' + f, { method: 'POST', body: blob });
      }
      await fetch('/render-complete');
    };

    // Initialisation
    window.onload = () => {
      if (assetsLoaded) {
        renderFrame(0);
      }
    };
  </script>
