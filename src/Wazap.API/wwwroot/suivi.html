<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>WAZAP — Suivi de livraison</title>
<style>
  :root{--vert:#1db954;--bg:#f4f6f8;--card:#fff;--txt:#1c2733;--muted:#6b7684;--radius:14px}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--txt);min-height:100vh}
  .wrap{max-width:460px;margin:0 auto;padding:20px 16px 40px}
  .logo{display:flex;align-items:center;gap:8px;font-weight:800;font-size:20px;margin:6px 0 16px}
  .card{background:var(--card);border-radius:var(--radius);padding:18px;box-shadow:0 2px 8px rgba(0,0,0,.05);margin-bottom:14px}
  h1{font-size:18px;margin-bottom:6px}
  h2{font-size:15px;margin-bottom:10px}
  .muted{color:var(--muted);font-size:13px}
  .pill{display:inline-block;background:#e7f6ee;color:#0e7a3e;font-weight:700;font-size:12px;border-radius:999px;padding:4px 10px}
  .row{display:flex;justify-content:space-between;align-items:center;gap:8px}
  label{display:block;font-size:13px;font-weight:600;margin:12px 0 4px}
  input[type=text]{width:100%;padding:12px;border:1px solid #d5dbe2;border-radius:10px;font-size:15px}
  .coords{font-size:12px;color:var(--muted);word-break:break-all;margin-top:6px}
  button{width:100%;padding:14px;border:none;border-radius:12px;font-size:16px;font-weight:700;cursor:pointer}
  .btn{background:var(--vert);color:#fff}
  .btn:disabled{opacity:.5}
  .btn2{background:#eef1f4;color:var(--txt);margin-top:8px}
  .ok{color:#0e7a3e;font-weight:600}
  .err{color:#c0392b;background:#fdecea;padding:10px;border-radius:8px;font-size:14px;margin-top:8px}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo">⚡ WAZAP <span class="muted">— Suivi</span></div>
  <div id="loading" class="card muted">Chargement de votre commande…</div>
  <div id="content" style="display:none"></div>
</div>
<script>
(function(){
  var id = new URLSearchParams(location.search).get('id');
  var BASE = '';
  var statusFr = { PendingVendorConfirmation:'En attente du vendeur', VendorConfirmed:'Vendeur accepté', AwaitingRiderAcceptance:'Recherche d’un livreur…', RiderAssigned:'Livreur en route', ReadyForPickup:'Prêt', PickedUp:'Colis récupéré', InTransit:'En cours de livraison', Delivered:'Livré ✓', Cancelled:'Annulé' };
  var $c = document.getElementById('content');
  function el(html){ var d=document.createElement('div'); d.innerHTML=html; return d.firstElementChild; }
  async function api(path, opts){
    var r = await fetch(BASE + path, Object.assign({ headers:{'Content-Type':'application/json'} }, opts||{}));
    var body = null; try{ body = await r.json(); }catch(e){}
    if(!r.ok){ throw new Error((body && (body.message||body.detail||body.title)) || 'Erreur ('+r.status+')'); }
    return body;
  }
  var timer=null;
  function startPoll(){ if(timer) clearInterval(timer); timer=setInterval(async function(){
    try{ var o=await api('/api/client/orders/'+id); var pill=document.getElementById('pill'); if(pill){ pill.textContent = o.delivered?'Livré ✓':(statusFr[o.status]||o.status); } if(o.delivered){ clearInterval(timer); } }catch(e){} },5000); }
  function render(o){
    if(o.needsCoordinates && !o.hasCoordinates){
      $c.innerHTML = '';
      var card = el('<div class="card"><h1>Commande #'+o.code+'</h1><p class="muted">Vendeur : '+(o.vendorName||'—')+'</p>'+
        '<div class="muted" style="margin-top:4px">'+(o.description||'Votre commande')+'</div>'+
        '<h2 style="margin-top:14px">Où livrer ?</h2>'+
        '<label>Votre adresse / repère (quartier, rue…)</label>'+
        '<input type="text" id="addr" placeholder="Ex : Marcory, rue Princesse, près de la pharmacie">'+
        '<button class="btn2" id="geo" type="button">📍 Utiliser ma position GPS</button>'+
        '<div class="coords" id="coords"></div>'+
        '<button class="btn" id="go" type="button" style="margin-top:12px">Valider et lancer la livraison</button>'+
        '<div class="err" id="err" style="display:none"></div></div>');
      $c.appendChild(card);
      var lat=null,lng=null,err=card.querySelector('#err');
      function showErr(m){ err.style.display='block'; err.textContent=m; }
      card.querySelector('#geo').onclick = function(){
        if(!navigator.geolocation){ showErr('Géolocalisation non supportée — saisissez votre adresse.'); return; }
        navigator.geolocation.getCurrentPosition(function(p){
          lat=p.coords.latitude; lng=p.coords.longitude;
          card.querySelector('#coords').textContent='Position : '+lat.toFixed(5)+', '+lng.toFixed(5);
        }, function(){ showErr('Impossible d’obtenir la position — saisissez votre adresse (le livreur vous appellera).'); });
      };
      card.querySelector('#go').onclick = async function(){
        var b=card.querySelector('#go'); b.disabled=true; b.textContent='Envoi…';
        if(lat==null||lng==null){ b.disabled=false; b.textContent='Valider et lancer la livraison'; showErr('Activez votre position (📍) ou réessayez.'); return; }
        var addr=card.querySelector('#addr').value;
        try{
          var res=await api('/api/client/orders/'+id+'/coordinates', {method:'POST', body:JSON.stringify({latitude:lat, longitude:lng, address:addr})});
          startPoll(); render({ needsCoordinates:false, hasCoordinates:true, code:o.code, vendorName:o.vendorName, description:o.description, status:'AwaitingRiderAcceptance' });
        }catch(e){ b.disabled=false; b.textContent='Valider et lancer la livraison'; showErr(e.message); }
      };
      return;
    }
    var st = o.delivered ? 'Livré ✓' : (statusFr[o.status]||o.status);
    $c.innerHTML = '';
    $c.appendChild(el('<div class="card">'+
      '<div class="row"><h1>Commande #'+o.code+'</h1><span class="pill" id="pill">'+st+'</span></div>'+
      '<p class="muted">Vendeur : '+(o.vendorName||'—')+'</p>'+
      (o.description?'<p style="margin-top:6px">'+(o.description)+'</p>':'')+
      (o.address?'<p class="muted" style="margin-top:4px">📍 '+(o.address)+'</p>':'')+
      '</div>'));
    startPoll();
  }
  api('/api/client/orders/'+id).then(function(o){
    document.getElementById('loading').style.display='none'; $c.style.display='block'; render(o);
  }).catch(function(e){
    document.getElementById('loading').innerHTML='<div class="err">'+e.message+'</div>';
  });
})();
</script>
</body>
</html>
